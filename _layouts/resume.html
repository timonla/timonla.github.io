<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - {{ site.SEOTitle }}</title>
  {% if page.description %}
  <meta name="description" content="{{ page.description }}">
  {% endif %}
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title }} - {{ site.SEOTitle }}">
  {% if page.description %}
  <meta property="og:description" content="{{ page.description }}">
  {% endif %}
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/profile-photo.jpg' | absolute_url }}">
  <meta property="og:image:width" content="1105">
  <meta property="og:image:height" content="1105">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="Timon Lapawczyk">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} - {{ site.SEOTitle }}">
  {% if page.description %}
  <meta name="twitter:description" content="{{ page.description }}">
  {% endif %}
  <meta name="twitter:image" content="{{ '/assets/img/profile-photo.jpg' | absolute_url }}">
  <meta name="twitter:image:alt" content="Timon Lapawczyk">
  <link rel="stylesheet" href="{{ '/assets/css/resume.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
</head>

<body class="resume-page">
  <main class="resume">
    {{ content }}
  </main>
  <script src="{{ '/assets/js/header-photo.js' | relative_url }}"></script>
</body>

</html>
